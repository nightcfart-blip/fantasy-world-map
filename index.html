<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1,
                   viewport-fit=cover">

    <meta name="theme-color" content="#0f1217">

    <meta name="apple-mobile-web-app-capable"
          content="yes">

    <meta name="apple-mobile-web-app-status-bar-style"
          content="black-translucent">

    <meta name="description"
          content="Aether — A personal worldbuilding archive.">

    <title>Aether — Worldbuilding</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Jost:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Cinzel:wght@400;500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=IM+Fell+English:ital@0;1&family=Great+Vibes&family=JetBrains+Mono:wght@400;500;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- APPLICATION -->

    <main id="app" aria-label="Aether Worldbuilding">

        <div id="aether-menu-root"></div>

        <div id="aether-page-root" hidden></div>

    </main>


    <!-- NOTIFICATIONS -->

    <div id="notification-root"
         role="status"
         aria-live="polite">
    </div>


    <!-- DIALOGS -->

    <dialog id="aether-dialog"
            class="archive-dialog">
    </dialog>


    <!-- FILE INPUTS -->

    <input id="backup-input"
           type="file"
           accept=".json,application/json"
           hidden>

    <input id="image-input"
           type="file"
           accept="image/*"
           hidden>


    <!-- JAVASCRIPT REQUIRED -->

    <noscript>

        <div style="padding:24px;color:#e6bd8b">

            Aether requires JavaScript to open your world.

        </div>

    </noscript>


    <!-- APPLICATION MODULES -->

    <script src="data.js" defer></script>
    <script src="app.js" defer></script>

</body>
</html>
