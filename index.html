<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover">

    <meta name="theme-color"
          content="#0f1217">

    <title>Aether.</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600;700&display=swap">

    <link rel="stylesheet"
          href="./style.css?v=2.1.1">

    <script>

        window.addEventListener("error", event => {

            const loading = document.getElementById(
                "startup-message"
            );

            if (!loading) return;

            loading.textContent =
                "Unable to open Aether: " +
                (
                    event.message ||
                    "A required file could not be loaded."
                );

        }, true);

        window.addEventListener(
            "unhandledrejection",
            event => {

                const loading = document.getElementById(
                    "startup-message"
                );

                if (!loading) return;

                loading.textContent =
                    "Unable to open Aether: " +
                    (
                        event.reason?.message ||
                        String(event.reason)
                    );

            }
        );

    </script>

    <script defer src="./data.js?v=2.1.1"></script>

    <script defer src="./app.js?v=2.1.1"></script>

</head>

<body>

    <div id="app">

        <div style="
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
        ">

            <span style="
                color: #e6bd8b;
                font-size: 32px;
            ">
                ◇
            </span>

            <p id="startup-message"
               role="status"
               style="
                   color: #7baaab;
                   font-size: 13px;
                   line-height: 1.6;
               ">
                Opening the archive...
            </p>

        </div>

    </div>

    <div id="notification-root"
         role="status"
         aria-live="polite">
    </div>

    <input type="file"
           id="backup-input"
           accept=".json,application/json"
           hidden>

</body>

</html>
