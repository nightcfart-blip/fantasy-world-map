
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover">

    <meta name="theme-color" content="#0f1217">

    <title>Compendium.</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="ambient-background"></div>

    <div id="app">

        <header id="app-header"></header>

        <main id="app-view">
            <div class="loading-screen">
                <span class="loading-orbit"></span>
                <p>Opening the archive...</p>
            </div>
        </main>

        <footer id="app-footer"></footer>

    </div>

    <div id="modal-root"></div>

    <div id="toast-root"
         role="status"
         aria-live="polite"></div>

    <input type="file"
           id="backup-input"
           accept=".json,application/json"
           hidden>

    <script src="data.js"></script>
    <script src="app.js"></script>

</body>
</html>
